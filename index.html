<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Nuevo Gobierno</title>
  <meta name="description" content="Forma tu gobierno con tus contactos de Bluesky y descarga el cartel.">
  <meta name="theme-color" content="#0b1220">
  <link rel="canonical" href="https://palomoduarte.com/el-nuevo-gobierno/">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Open Graph (Bluesky, WhatsApp, Telegram, Facebook, LinkedIn…) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="El Nuevo Gobierno">
  <meta property="og:title" content="El Nuevo Gobierno">
  <meta property="og:description" content="Forma tu gobierno con la gente con la que más interactúas en Bluesky y descarga el cartel.">
  <meta property="og:url" content="https://palomoduarte.com/el-nuevo-gobierno/">
  <meta property="og:image" content="https://palomoduarte.com/el-nuevo-gobierno/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Cartel 'El nuevo Gobierno' con tarjetas de ministros">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="El Nuevo Gobierno">
  <meta name="twitter:description" content="Forma tu gobierno con la gente con la que más interactúas en Bluesky y descarga el cartel.">
  <meta name="twitter:image" content="https://palomoduarte.com/el-nuevo-gobierno/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main>
    <header class="intro">
      <h1>El Nuevo Gobierno</h1>
      <p>Escribe tu usuario y te montamos el gabinete con la gente con la que más interactúas. Todo pasa en tu navegador.</p>
    </header>

    <form id="form" class="panel" autocomplete="off">
      <div class="networks" role="radiogroup" aria-label="Red social">
        <label><input type="radio" name="network" value="bluesky" checked> Bluesky</label>
        <label class="soon" title="Próximamente"><input type="radio" name="network" value="twitter" disabled> X / Twitter</label>
        <label class="soon" title="Próximamente"><input type="radio" name="network" value="instagram" disabled> Instagram</label>
      </div>

      <label class="field">
        <span>Tu usuario</span>
        <input id="handle" name="handle" type="text" placeholder="tunombre.bsky.social" required autocapitalize="off" spellcheck="false">
      </label>

      <fieldset class="field">
        <legend>¿A quién nombramos?</legend>
        <label><input type="radio" name="source" value="interactions" checked> Con quien más interactúo</label>
        <label><input type="radio" name="source" value="follows"> Gente a la que sigo (al azar)</label>
      </fieldset>

      <fieldset class="field">
        <legend>Ministerios</legend>
        <label><input type="radio" name="cabinet" value="serio" checked> Serios</label>
        <label><input type="radio" name="cabinet" value="internet"> De internet</label>
      </fieldset>

      <button type="submit" id="go">Formar gobierno</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <section id="result" class="result" hidden>
      <canvas id="poster" width="1200" height="1500"></canvas>
      <div class="actions">
        <button id="download" type="button">Descargar imagen</button>
        <button id="shuffle" type="button" class="secondary">Barajar carteras</button>
      </div>
      <details class="panel editor">
        <summary>Editar nombres y carteras</summary>
        <ol id="slots"></ol>
      </details>
    </section>

    <footer class="foot">
      <p>Usa la API pública de Bluesky, sin login. No guardamos nada. Parodia, no afiliada a ningún partido. <span class="ver">v7</span></p>
    </footer>
  </main>
  <script src="app.js?v=7"></script>
  <!-- Simple Analytics: sin cookies, cumple RGPD -->
  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt="" referrerpolicy="no-referrer-when-downgrade"></noscript>
</body>
</html>
